version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
